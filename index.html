<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>TileFruits</title>
    <link rel="preconnect" href="https://bridge.playgama.com">
    <link rel="preload" href="Build/WebGL.wasm.unityweb" as="fetch" type="application/wasm" crossorigin>
    <link rel="preload" href="Build/WebGL.data.unityweb" as="fetch" crossorigin>
    <link rel="preload" href="Build/WebGL.framework.js.unityweb" as="script">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0px;
            margin: 0px;
            overflow: hidden;
        }
        .fullscreen-canvas {
            background: #242424;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0px;
            left: 0px;
        }

        #loader-overlay {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            background-color: #242424;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            
            transform: translateY(-8vh);
        }
        .loader-logo {
            width: 220px;
            height: auto;
            margin-bottom: 25px;
            display: block;
        }
        .loader-slider-container {
            width: 270px;
            height: 8px;
            background-color: #3e3e3e;
            border-radius: 4px;
            overflow: hidden;
        }
        .loader-slider-bar {
            width: 0%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 4px;
            transition: width 0.15s ease-out;
        }
    </style>
</head>
<body>
<!-- Экран загрузки -->
<div id="loader-overlay">
    <div class="loader-content">
        <img src="logo.png" class="loader-logo" alt="Game Logo">
        <div class="loader-slider-container">
            <div id="loader-slider-bar" class="loader-slider-bar"></div>
        </div>
    </div>
</div>

<canvas id="canvas" class="fullscreen-canvas"></canvas>
<script src="./playgama-bridge-unity.js"></script>

<script>
    
    if (typeof onUnityLoadingProgressChanged === 'function') {
        const originalProgressCallback = onUnityLoadingProgressChanged;

        onUnityLoadingProgressChanged = function(progress) {
            
            originalProgressCallback(progress);

            const progressBar = document.getElementById('loader-slider-bar');
            const overlay = document.getElementById('loader-overlay');

            let percent = progress * 100;
            if (percent > 100) percent = 100;

            if (progressBar) {
                progressBar.style.width = percent + '%';
            }

            if (progress >= 1) {
                setTimeout(() => {
                    if (overlay) {
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            overlay.style.display = 'none';
                        }, 500);
                    }
                }, 150);
            }
        };
    }
</script>
</body>
</html>
